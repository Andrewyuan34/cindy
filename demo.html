<style>

relative}.apphead{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border-default);padding:12px 18px;min-height:61px}.apptitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}.mobile-list{display:none}.chat{padding:36px clamp(16px,5%,56px);flex:1;overflow:auto}.chat p{margin:0 0 22px;max-width:560px;line-height:1.8}.bubble{margin-left:auto!important;background:var(--surface-chip);padding:10px 16px;border-radius:12px;width:fit-content}.chat .answer{margin-top:32px}.phase{font-size:12px;color:var(--text-secondary);margin-top:5px}.composer-area{padding:12px 24px 20px;position:relative}.activity{display:flex;align-items:center;min-height:40px;gap:8px}.composer{border:1px solid var(--border-default);border-radius:12px;padding:10px 12px}.composer textarea{display:block;border:0;background:none;resize:none;width:100%;height:44px;padding:4px}.composer textarea:focus-visible{outline:1px solid var(--text-secondary);outline-offset:0;border-radius:8px}.composer .bottom{display:flex;justify-content:space-between;align-items:center;color:var(--text-secondary)}.float{position:absolute;right:24px;bottom:146px;width:min(300px,calc(100% - 32px));max-height:430px;overflow:auto;border:1px solid var(--border-default);border-radius:12px;background:var(--surface-elevated);padding:16px;box-shadow:var(--shadow-menu);z-index:10;transform-origin:bottom right;animation:enter var(--motion-fast) var(--ease)}.float.top{top:62px;bottom:auto;transform-origin:top right}.float.wide{width:min(380px,calc(100% - 32px))}.float.closing{animation:leave var(--motion-instant) ease-in both}.float h3{font-size:14px;font-weight:500;margin:12px 0}.float header{display:flex;align-items:center;justify-content:space-between;gap:8px}.old{font-size:12px;color:var(--text-secondary);margin:12px 0 4px}.new{font-size:17px;font-weight:500;line-height:1.5;margin:3px 0 14px;overflow-wrap:anywhere}.actions{display:flex;justify-content:flex-end;gap:6px;margin-top:16px}.field{bord </style></head><body>
<div class="lab"><header class="labhead"><div><h1>让标题跟上工作</h1><div class="small muted">线框与动效 · 仅本地模拟，待确认</div></div><div class="row"><button id="themeBtn" class="icon" aria-label="切换深浅主题" data-tip="切换深浅主题"></button><button id="phoneBtn" class="icon" aria-label="切换手机预览" data-tip="切换手机预览"></button></div></header>
<nav class="toolbar" aria-label="原型视图"><div class="seg"><button id="boardBtn" class="active">线框总览</button><button id="demoBtn">交互演示</button></div><span class="small muted" id="viewhint">9个场景，覆盖20项UI</span></nav>
<section id="board" class="board" aria-label="全部界面线框"></section>
<section id="demo" hidden><div class="toolbar"><label class="sr" for="sceneSelect">选择演示场景</label><select id="sceneSelect"></select><button id="playBtn" class="outline"></button><button id="resetBtn" class="icon" aria-label="重置本地演示" data-tip="重置本地演示"></button></div><div class="stagewrap"><div id="device" class="device"><div class="app">
<aside class="sidebar"><div class="brand">Cindy</div><button class="menulink" data-do="search"></button><div class="section">最近任务</div><button class="task current" data-do="current"><span data-current>支付故障修复</span></button><button class="task" data-do="other" data-title="账单服务：补集成测试"><span>账单服务：补集成测试</span></button><button class="task" data-do="other" data-title="用户中心：排查证书"><span>用户中心：排查证书</span></button><div class="section">项目</div><div class="small muted" style="padding:0 8px">支付网关</div></aside>
<main class="main"><header class="apphead"><button class="icon mobile-list" data-do="list" aria-label="打开任务列表" data-tip="打开任务列表"></button><div class="grow"><div class="apptitle" data-current>支付故障修复</div><div id="phase" class="phase" hidden>当前：排查证书配置</div></div><button id="lockMark" class="icon" data-do="menu" aria-label="标题已锁定，查看控制" data-tip="标题已锁定" hidden></button><button id="menuBtn" class="icon" data-do="menu" aria-label="打开标题菜单" data-tip="标题菜单"></button></header>
<div class="chat" id="chat"><p class="bubble">继续排查支付失败，先看证书配置。</p><p class="answer">已定位到证书链配置。下一步核对回调服务的证书，再验证支付流程。</p><div class="small muted">检查完成</div></div>
<div class="composer-area"><div class="activity"><div class="grow small muted">就绪</div><div id="feedback" class="hintrow" hidden></div><button id="suggestBtn" class="icon appear" data-do="suggest" aria-label="查看标题建议" data-tip="查看标题建议"></button></div><div class="composer"><textarea id="compose" aria-label="模拟聊天输入框" placeholder="继续这项工作…"></textarea><div class="bottom"><span class="small">仅演示，不会发送</span><button class="icon" disabled aria-label="演示中不发送消息" id="sendBtn"></button></div></div></div>
<div id="panel" class="float" role="dialog" aria-label="标题操作" hidden></div></main></div></div><div class="caption"><span id="caption">小图标出现，输入不被打断。</span><span id="coverage"></span></div></div>
<details class="demo-controls"><summary>演示条件</summary><div class="toolbar"><label>呈现<select id="presentation"><option value="dynamic">动态主标题</option><option value="stable">稳定主标题＋阶段</option></select></label><label>状态<select id="condition"><option value="normal">正常</option><option value="none">无变化</option><option value="stale">建议已过期</option><option value="offline">提交失败／离线</option><option value="generation">AI生成失败</option><option value="missing">父任务不可用</option><option value="empty">无历史记录</option></select></label><label><input type="checkbox" id="reduce">减少动效</label></div><p class="labnote">这些是预览工具，不会放进产品界面。自动更新与阶段演变仅展示后期概念。</p></details></section>
<p class="labnote">先看整体，再点任意场景试用。关闭浮层 ≠ 保留原名 ≠ 锁定。</p><div id="live" class="sr" aria-live="polite"></div></div>
<script>
const $=id=>document.getElementById(id), paths={spark:'M12 3l2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2Z',edit:'M15 5l4 4M4 20l4-1L20 7a2.8 2.8 0 0 0-4-4L4 15Z',check:'m5 12 4 4L19 6',close:'m6 6 12 12M18 6 6 18',more:'M5 12h.01M12 12h.01M19 12h.01',lock:'M7 10V7a5 5 0 0 1 10 0v3M5 10h14v11H5Z',unlock:'M7 10V7a5 5 0 0 1 9-3M5 10h14v11H5Z',undo:'M9 5 4 10l5 5M4 10h10a6 6 0 0 1 0 12',history:'M3 11a9 9 0 1 1 2 7M3 4v7h7M12 7v5l3 2',branch:'M6 3v12a5 5 0 0 0 10 0V9M3 3h6M13 9h6',search:'M17 17l5 5M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',settings:'M4 7h16M4 17h16M8 4v6M16 14v6',arrow:'M5 12h14m-5-5 5 5-5 5',sun:'M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1 1M18 18l1 1M5 19l1-1M18 6l1-1M17 12a5 5 0 1 1-10 0 5 5 0 0 1 10 0',phone:'M6 2h12v20H6ZM10 19h4',play:'m8 4 12 8-12 8Z',stop:'M6 6h12v12H6Z',list:'M4 6h16M4 12h16M4 18h16',send:'m12 19 0-14m-5 5 5-5 5 5'};
const icon=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.more}"/></svg>`;
const ib=(action,n,label)=>`<button class="icon" data-do="${action}" aria-label="${label}" data-tip="${label}">${icon(n)}</button>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const scenes=[
{id:'suggest',name:'01 建议',title:'建议出现 → 展开 → 采用',ids:'01–04 · 09–10',hint:'小图标出现，输入不被打断。',wire:'<div class="line"></div><div class="line short"></div><div class="minirow"><span class="tag">输入栏上方</span>'+icon('spark')+'</div><div class="tag">支付故障修复 →</div><b>支付故障：排查证书</b><div class="minirow"><span class="minibtn">保留</span><span class="minibtn">采用</span></div>'},
{id:'edit',name:'02 编辑',title:'修改候选 · AI起名',ids:'05–06',hint:'复用改名输入框，用户输入不会被新建议替换。',wire:'<span class="tag">重命名</span><div class="minibtn">支付故障：排查证书</div><div class="minirow">'+icon('spark')+'<span class="minibtn">保存</span></div>'},
{id:'menu',name:'03 锁定',title:'菜单 · 锁定与解除',ids:'07–08',hint:'锁定停止建议；解除后仍只建议，不自动改名。',wire:'<div class="minirow">'+icon('edit')+'<span>重命名</span></div><div class="minirow">'+icon('lock')+'<span>锁定标题</span></div><div class="minirow">'+icon('history')+'<span>标题历史</span></div>'},
{id:'search',name:'04 找回',title:'旧名搜索 · 当前名称',ids:'10–12',hint:'搜旧名字，仍找到同一个任务。',wire:'<div class="minibtn">⌕ 支付故障修复</div><b>支付故障：排查证书</b><span class="tag">曾用名 · 支付故障修复</span><div class="line short"></div>'},
{id:'history',name:'05 历史',title:'曾用名 · 恢复与定位',ids:'09 · 13–14',hint:'历史只按需展开；恢复是一次明确的改名。',wire:'<span class="tag">今天 14:20</span><b>支付故障：排查证书</b><div class="line"></div><span>支付故障修复</span><div class="minirow"><span class="tag">原名称</span><span class="minibtn">恢复</span></div>'},
{id:'source',name:'06 来源',title:'分支 · 返回原任务',ids:'15',hint:'分支改名不丢来源；来源不存在时明确说明。',wire:'<span class="tag">分支来源</span><div class="minirow">'+icon('branch')+'<b>支付网关升级</b>'+icon('arrow')+'</div><div class="line"></div><span class="tag">从证书排查前分出</span>'},
{id:'settings',name:'07 设置',title:'只建议 · 锁定',ids:'16',hint:'当前任务的控制明确可见，自动模式不会偷偷开启。',wire:'<span class="tag">当前任务</span><b>◉ 只建议，接受才改</b><span>○ 锁定标题</span><span class="tag">自动更新 · 后期选项</span>'},
{id:'exception',name:'08 异常',title:'过期 · 失败 · 无变化',ids:'17–18 · 20',hint:'在原位置解释问题，保留用户输入。',wire:'<span class="tag">标题建议</span><b>建议已过期</b><span class="tag">当前名称已发生变化</span><div class="minirow"><span></span><span class="minibtn">重新检查</span></div>'},
{id:'timeline',name:'09 演变',title:'阶段概要 · 后期概念',ids:'19',hint:'后期概念：按聊天顺序展开，不在每轮正文插卡。',wire:'<span class="tag">后期概念</span><span>○ 定位支付失败</span><span>│</span><b>○ 排查证书配置</b><span class="tag">展开概要 → 定位对话</span>'}
];
let s,openKind='',returnEl=null,playTimers=[],playing=false,epoch=0;const initial='支付故障修复',candidate='支付故障：排查证书';
function init(){epoch++;s={title:initial,pending:true,locked:false,history:[],undo:null,parent:false};openKind='';$('panel').hidden=true;$('feedback').hidden=true;render();}
function announce(t){$('live').textContent=t;}
function render(){document.querySelectorAll('[data-current]').forEach(e=>{e.textContent=s.title;e.title=s.title});$('suggestBtn').hidden=!s.pending||s.locked||$('condition').value==='none'||$('presentation').value==='stable';$('lockMark').hidden=!s.locked;$('phase').hidden=$('presentation').value!=='stable';}
function closePanel(focus=true){const p=$('panel');if(p.hidden)return;openKind='';p.classList.add('closing');setTimeout(()=>{if(openKind)return;p.hidden=true;p.classList.remove('closing');if(focus){const target=returnEl&&document.contains(returnEl)&&returnEl.getClientRects().length?returnEl:$('compose');target.focus();}},document.documentElement.classList.contains('reduce')?0:80)}
function head(label){return `<header><span class="small muted">${label}</span>${ib('close','close','关闭浮层')}</header>`}
function show(kind,focus=true){if(!$('panel').contains(document.activeElement))returnEl=document.activeElement;openKind=kind;const p=$('panel');p.hidden=false;p.className='float '+(['menu','source','settings','list'].includes(kind)?'top ':'')+(['history','timeline','search'].includes(kind)?'wide':'');let html='';const cond=$('condition').value;
if(kind==='suggest'){if(s.locked){show('menu',focus);return}if(cond==='stale')html=head('标题建议')+'<h3>建议已过期</h3><p class="small muted">当前名称已变化，旧建议不会应用。</p><div class="actions"><button data-do="retry" class="outline">重新检查</button></div>';
else html=head('标题建议')+`<div class="old">${esc(s.title)} →</div><div class="new">${candidate}</div><details><summary>为什么</summary><p class="small muted">工作已从定位失败转入证书排查。</p></details><div class="row">${ib('edit','edit','编辑建议')}${ib('menu','more','更多标题操作')}</div><div id="actionError" class="notice" role="status"></div><div class="actions"><button data-do="keep">保留</button><button class="primary" data-do="accept">${icon('check')}采用</button></div>`;}
if(kind==='edit')html=head('重命名')+`<label class="sr" for="editName">任务名称</label><input class="field" id="editName" maxlength="80" value="${esc(s.pending?candidate:s.title)}"><div class="row">${ib('magic','spark','AI重新起名')}<span id="magicStatus" class="small muted"></span></div><div id="actionError" class="notice" role="status"></div><div class="actions"><button data-do="close">取消</button><button class="primary" data-do="save">保存</button></div>`;
if(kind==='menu')html=head('标题')+`<button class="menulink" data-do="edit">${icon('edit')}重命名</button><button class="menulink" data-do="toggleLock">${icon(s.locked?'unlock':'lock')}${s.locked?'解除锁定':'锁定标题'}</button><div class="divider"></div><button class="menulink" data-do="history">${icon('history')}标题历史</button><button class="menulink" data-do="source">${icon('branch')}分支来源</button><button class="menulink" data-do="settings">${icon('settings')}标题设置</button>`;
if(kind==='search')html=head('搜索任务')+`<label class="sr" for="query">搜索标题或曾用名</label><input class="field" id="query" value="支付故障修复" placeholder="搜索标题或曾用名"><div id="searchResults"></div>`;
if(kind==='history'){html=head('标题历史');if(cond==='empty')html+='<div class="empty">还没有改名记录</div>';else{const entries=[s.title,...s.history.map(h=>h.old)].filter((x,i,a)=>a.indexOf(x)===i);html+=entries.map((x,i)=>`<div class="record"><div class="small muted">${i===0?'当前名称':'曾用名'}</div><p>${esc(x)}</p>${i?`<div class="row"><button class="outline" data-do="restore" data-title="${esc(x)}">恢复</button><button data-do="jump">定位对话</button></div>`:''}</div>`).join('');}html+='<button class="menulink" data-do="timeline">'+icon('history')+'阶段演变 <span class="muted small">后期</span></button>';}
if(kind==='source')html=head('分支来源')+(cond==='missing'?'<div class="empty">来源已不可用</div>':`<button class="menulink" data-do="parent">${icon('branch')}<span class="grow">支付网关升级</span>${icon('arrow')}</button><p class="small muted">从证书排查前分出</p>`);
if(kind==='settings')html=head('标题设置')+`<p class="small muted">仅当前任务</p><label class="radio"><input type="radio" name="mode" value="suggest" ${s.locked?'':'checked'}>只建议，接受才改</label><label class="radio"><input type="radio" name="mode" value="locked" ${s.locked?'checked':''}>锁定标题</label><div class="divider"></div><label class="radio muted"><input type="radio" disabled>自动更新 <span class="small">后期选项</span></label>`;
if(kind==='timeline')html=head('阶段演变 · 后期概念')+`<div class="timeline"><details><summary>定位支付失败</summary><p>核对回调与支付日志，缩小故障范围。</p><button data-do="jump">定位对话</button></details><details open><summary>排查证书配置</summary><p>检查证书链，验证支付回调。</p><button data-do="jump">定位对话</button></details></div>`;
if(kind==='list')html=head('任务')+`<button class="menulink" data-do="search">${icon('search')}搜索</button>`+[s.title,'账单服务：补集成测试','用户中心：排查证书'].map(x=>`<button class="menulink" data-do="other" data-title="${esc(x)}">${esc(x)}</button>`).join('');
p.innerHTML=html;if(kind==='search')search();if(focus){const f=p.querySelector('input:not([disabled])')||p.querySelector('button');f?.focus();}p.setAttribute('aria-label',({suggest:'标题建议',edit:'重命名',menu:'标题菜单',history:'标题历史',source:'分支来源',settings:'标题设置',search:'搜索任务',timeline:'阶段演变',list:'任务列表'})[kind]||'标题操作');announce(p.getAttribute('aria-label'));}
function search(){const q=$('query').value.trim();const matches=!q||s.title.includes(q)||s.history.some(h=>h.old.includes(q));$('searchResults').innerHTML=matches?`<button class="menulink" data-do="result" style="display:block;text-align:left"><div>${esc(s.title)}</div>${q&&!s.title.includes(q)?`<div class="small muted">曾用名 · ${esc(s.history.find(h=>h.old.includes(q)).old)}</div>`:''}</button>`:'<div class="empty">未找到任务</div>';}
function feedback(text,undo=false){$('feedback').hidden=false;$('feedback').innerHTML=icon('check')+`<span class="small">${esc(text)}</span>`+(undo?'<button data-do="undo" aria-label="撤销改名" class="icon" data-tip="撤销改名">'+icon('undo')+'</button>':'');announce(text);}
function commit(name){if(!name.trim()){const e=$('actionError');if(e)e.textContent='请输入名称';return}if($('condition').value==='stale'){show('suggest');return}if($('condition').value==='offline'){const e=$('actionError');if(e)e.textContent='未保存，请重试。输入已保留。';return}const old=s.title;s.history.unshift({old,new:name});s.title=name;s.undo=old;s.pending=false;render();closePanel(false);feedback('已改名',true);setTimeout(()=>$('feedback').querySelector('button')?.focus(),90);}
function action(a,el){stopDemo();switch(a){case 'suggest':case 'edit':case 'menu':case 'history':case 'source':case 'settings':case 'search':case 'timeline':case 'list':show(a);break;case 'close':closePanel();break;case 'accept':{const e=epoch;el.disabled=true;el.textContent='保存中';setTimeout(()=>{if(e!==epoch||openKind!=='suggest')return;el.disabled=false;el.innerHTML=icon('check')+'采用';commit(candidate)},240);break}case 'save':commit($('editName').value.trim());break;case 'keep':s.pending=false;render();closePanel(false);$('compose').focus();announce('已保留原名');break;case 'toggleLock':s.locked=!s.locked;render();closePanel(false);$('menuBtn').focus();feedback(s.locked?'已锁定':'已恢复建议');break;case 'undo':if(s.undo){const restore=s.undo;s.history.unshift({old:s.title,new:restore});s.title=restore;s.undo=null;render();feedback('已撤销');$('compose').focus();}break;case 'magic':{const value=$('editName').value,e=epoch;$('magicStatus').textContent='生成中…';el.disabled=true;setTimeout(()=>{if(e!==epoch||openKind!=='edit')return;el.disabled=false;if($('condition').value==='generation'){$('magicStatus').textContent='未生成，请重试';return}if($('editName').value===value)$('editName').value='支付回调：修复证书链';$('magicStatus').textContent='可继续编辑';},450);break}case 'retry':$('condition').value='normal';show('suggest');break;case 'restore':show('edit');$('editName').value=el.dataset.title;$('editName').focus();break;case 'jump':closePanel(false);$('chat').innerHTML='<p class="small muted">历史位置 · 证书排查开始</p><p class="bubble">继续排查支付失败，先看证书配置。</p><p>正在查看这次标题对应的工作。</p>';$('chat').tabIndex=-1;$('chat').focus();break;case 'parent':s.parent=true;s.title='支付网关升级';s.pending=false;render();closePanel(false);$('chat').innerHTML='<p class="small muted">原任务</p><p>升级支付网关，并验证回调与证书。</p><button class="outline" data-do="back">返回分支</button>';$('chat').querySelector('button').focus();break;case 'back':setScene('source');break;case 'current':closePanel();break;case 'result':closePanel(false);$('compose').focus();announce('已打开搜索结果');break;case 'other':epoch++;s.title=el.dataset.title;s.pending=false;render();closePanel(false);$('compose').focus();break;}}
function seedAccepted(){s.title=candidate;s.history=[{old:initial,new:candidate}];s.pending=false;render()}
function setScene(id){stopDemo();$('presentation').value='dynamic';$('condition').value='normal';init();$('sceneSelect').value=id;const scene=scenes.find(x=>x.id===id);$('caption').textContent=scene.hint;$('coverage').textContent='UI '+scene.ids;$('chat').innerHTML='<p class="bubble">继续排查支付失败，先看证书配置。</p><p class="answer">已定位到证书链配置。下一步核对回调服务的证书，再验证支付流程。</p><div class="small muted">检查完成</div>';if(['search','history'].includes(id))seedAccepted();if(id==='exception'){$('condition').value='stale';show('suggest',false)}else if(id!=='suggest')show(id,false);}
function view(demo){$('board').hidden=demo;$('demo').hidden=!demo;$('boardBtn').classList.toggle('active',!demo);$('demoBtn').classList.toggle('active',demo);$('viewhint').textContent=demo?'点击界面试用，或播放一段动效':'9个场景，覆盖20项UI';if(!demo)stopDemo();}
function stopDemo(){playTimers.forEach(clearTimeout);playTimers=[];playing=false;$('playBtn').innerHTML=icon('play')+'播放动效';}
function play(){
 if(playing){stopDemo();return}
 const id=$('sceneSelect').value;setScene(id);
 let steps=[];
 if(id==='suggest'){
  s.pending=false;render();
  steps=[['建议图标轻轻出现',()=>{s.pending=true;render()}],['模拟点击，展开候选',()=>show('suggest',false)],['模拟采用，标题同步更新',()=>commit(candidate)],['模拟撤销，原名恢复',()=>{s.title=initial;s.history.unshift({old:candidate,new:initial});s.undo=null;render();feedback('已撤销')}]];
 }else if(id==='edit'){
  steps=[['打开已有改名框',()=>show('edit',false)],['模拟AI建议，保留编辑权',()=>{$('editName').value='支付回调：修复证书链';$('magicStatus').textContent='可继续编辑'}],['模拟保存',()=>commit('支付回调：修复证书链')]];
 }else if(id==='menu'){
  steps=[['在菜单中选择锁定',()=>show('menu',false)],['已锁定，建议入口消失',()=>{s.locked=true;render();closePanel(false);feedback('已锁定')}],['随时解除锁定',()=>show('menu',false)],['恢复只建议，名字没有改变',()=>{s.locked=false;render();closePanel(false);feedback('已恢复建议')}]];
 }else if(id==='search'){
  steps=[['用旧名字查找',()=>show('search',false)],['结果显示当前名与曾用名',()=>{$('query').value=initial;search()}],['打开同一个任务',()=>{closePanel(false);feedback('已找到任务')}]];
 }else if(id==='history'){
  steps=[['展开精简历史',()=>show('history',false)],['恢复前仍可编辑',()=>{show('edit',false);$('editName').value=initial}],['模拟保存，原名恢复',()=>commit(initial)]];
 }else if(id==='source'){
  steps=[['查看分支来源',()=>show('source',false)],['模拟返回原任务',()=>{s.title='支付网关升级';s.pending=false;render();closePanel(false);$('chat').innerHTML='<p class="small muted">原任务</p><p>升级支付网关，并验证回调与证书。</p><button class="outline" data-do="back">返回分支</button>'}],['返回分支，保留自己的名称',()=>{s.title=initial;s.pending=true;render();show('source',false)}]];
 }else if(id==='settings'){
  steps=[['默认只建议',()=>show('settings',false)],['用户明确选择锁定',()=>{s.locked=true;render();show('settings',false)}],['解除后依旧只建议',()=>{s.locked=false;render();show('settings',false)}]];
 }else if(id==='exception'){
  steps=[['过期候选不能采用',()=>show('suggest',false)],['重新检查后才有新候选',()=>{$('condition').value='normal';show('suggest',false)}],['模拟离线：不改变标题',()=>{$('condition').value='offline';commit(candidate)}],['恢复连接后可重试',()=>{$('condition').value='normal';show('suggest',false)}]];
 }else{
  steps=[['阶段默认只显示概要',()=>{show('timeline',false);$('panel').querySelectorAll('details').forEach(e=>e.open=false)}],['按需展开当前阶段',()=>{$('panel').querySelectorAll('details')[1].open=true}],['再展开之前的阶段',()=>{$('panel').querySelectorAll('details')[0].open=true}]];
 }
 playing=true;$('playBtn').innerHTML=icon('stop')+'停止演示';
 steps.forEach(([label,fn],i)=>playTimers.push(setTimeout(()=>{fn();$('caption').textContent=(i+1)+' / '+steps.length+' · '+label;if(i===steps.length-1)stopDemo()},700+i*1500)));
}

$('board').innerHTML=scenes.map(x=>`<article class="tile"><h2>${x.name} <span class="muted small">${x.id==='timeline'?'后期':''}</span></h2><div class="wire">${x.wire}</div><footer><span class="small muted">UI ${x.ids}</span><button class="icon" data-scene="${x.id}" aria-label="演示${x.name}" data-tip="演示${x.name}">${icon('arrow')}</button></footer></article>`).join('');
$('sceneSelect').innerHTML=scenes.map(x=>`<option value="${x.id}">${x.title}</option>`).join('');$('themeBtn').innerHTML=icon('sun');$('phoneBtn').innerHTML=icon('phone');$('playBtn').innerHTML=icon('play')+'播放动效';$('resetBtn').innerHTML=icon('undo');$('menuBtn').innerHTML=icon('more');$('lockMark').innerHTML=icon('lock');$('suggestBtn').innerHTML=icon('spark');$('sendBtn').innerHTML=icon('send');document.querySelector('.mobile-list').innerHTML=icon('list');document.querySelector('.sidebar [data-do=search]').innerHTML=icon('search')+'搜索任务';
$('boardBtn').onclick=()=>view(false);$('demoBtn').onclick=()=>view(true);$('themeBtn').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';};$('phoneBtn').onclick=()=>{$('device').classList.toggle('phone');view(true)};$('playBtn').onclick=play;$('resetBtn').onclick=()=>setScene($('sceneSelect').value);$('sceneSelect').onchange=()=>setScene($('sceneSelect').value);$('reduce').onchange=e=>document.documentElement.classList.toggle('reduce',e.target.checked);$('presentation').onchange=()=>{stopDemo();s.title=$('presentation').value==='stable'?initial:candidate;s.pending=false;render();closePanel(false);$('caption').textContent=$('presentation').value==='stable'?'主名保留，当前阶段在下一行。':'主名保留业务目标，并包含当前重点。';};$('condition').onchange=()=>{stopDemo();epoch++;const c=$('condition').value;render();if(c==='none')closePanel(false);else if(c==='missing')show('source',false);else if(c==='empty')show('history',false);else if(c==='generation')show('edit',false);else show('suggest',false);};
document.addEventListener('click',e=>{const scene=e.target.closest('[data-scene]');if(scene){view(true);setScene(scene.dataset.scene);$('device').scrollIntoView({block:'nearest'});return}const b=e.target.closest('[data-do]');if(b){action(b.dataset.do,b);return}if(!$('panel').hidden&&!e.target.closest('#panel')&&!e.target.closest('.toolbar')&&!e.target.closest('.demo-controls'))closePanel(false);});document.addEventListener('input',e=>{if(e.target.id==='query')search()});document.addEventListener('change',e=>{if(e.target.name==='mode'){s.locked=e.target.value==='locked';render();announce(s.locked?'已锁定标题':'只建议，接受才改');}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('panel').hidden){e.preventDefault();closePanel();}if(e.key==='Enter'&&e.target.id==='editName'){e.preventDefault();commit(e.target.value.trim())}});
init();setScene('suggest');
</script></body></html>
